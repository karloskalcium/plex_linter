---
name: CI
on:
  push:
    branches: master
  pull_request:
    branches: master

permissions:
  contents: read

jobs:
  ci:
    name: continuous-integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version-file: .python-version
      - name: Install just
        uses: extractions/setup-just@v4

      - name: Run tests
        shell: bash
        run: |
          just lint test
